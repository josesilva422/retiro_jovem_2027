[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  included_files = ["config.json", "public/js/pricing.js"]

[[redirects]]
  from = "/api/config"
  to = "/.netlify/functions/config"
  status = 200

[[redirects]]
  from = "/api/register"
  to = "/.netlify/functions/register"
  status = 200

[[redirects]]
  from = "/api/lookup"
  to = "/.netlify/functions/lookup"
  status = 200

[[redirects]]
  from = "/api/pay"
  to = "/.netlify/functions/pay"
  status = 200

[[redirects]]
  from = "/api/infinitepay-webhook"
  to = "/.netlify/functions/infinitepay-webhook"
  status = 200

[[redirects]]
  from = "/consulta"
  to = "/consulta.html"
  status = 200

[[redirects]]
  from = "/api/admin/*"
  to = "/.netlify/functions/admin/:splat"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex"
    Cache-Control = "no-store"
